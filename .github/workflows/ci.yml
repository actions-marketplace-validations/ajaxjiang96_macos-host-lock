name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run verify

  smoke:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Acquire and release a real host lock
        uses: ./
        with:
          lock-name: action-smoke-test
          timeout-seconds: '30'
          stale-seconds: '120'
